warnings:
- In a systematic review of 31 studies (15,587 patients with bipolar disorder), physical activity was associated with fewer depressive symptoms, better quality of life and increased functioning.
- Some evidence indicates a relationship between vigorous exercise and mania.
- Sedentary lifestyle ranged from 40% to 64.9% of patients.
- Most studies were cross-sectional and no randomized trial was identified; the evidence was insufficient to establish cause and effect between mood and exercise.
