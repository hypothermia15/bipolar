warnings:
- In a 6-week randomized trial in adults with bipolar I depression, lurasidone 20 to 120 mg/day reduced depressive symptoms more than placebo (effect size about 0.5).
- The most frequent adverse events in that trial were nausea, headache, akathisia and somnolence; changes in weight, lipids and glycemic measures were minimal.
- In youths aged 10 to 18, a network meta-analysis of four randomized trials found lurasidone and the olanzapine-fluoxetine combination, but not quetiapine, efficacious for bipolar depression.
- In the same analysis lurasidone was associated with smaller changes in weight, cholesterol and triglycerides than quetiapine and the olanzapine-fluoxetine combination.
