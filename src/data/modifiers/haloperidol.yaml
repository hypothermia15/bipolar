warnings:
  - "Elderly patients with dementia-related psychosis treated with antipsychotics have an increased risk of death; haloperidol is not approved for this use."
  - "Extrapyramidal symptoms (acute dystonia, akathisia, parkinsonism, rigidity) are markedly more frequent than with second-generation antipsychotics, and tardive dyskinesia after long-term use may be irreversible."
  - "Neuroleptic malignant syndrome — hyperthermia, generalised muscle rigidity, autonomic instability, altered consciousness and raised creatine kinase — is rare but potentially fatal and requires immediate discontinuation."
  - "QTc prolongation, ventricular arrhythmias including torsade de pointes, and sudden death have been reported; ECG monitoring is advised, especially with other QT-prolonging drugs, hypokalaemia, or high intravenous doses."
  - "Switch into post-manic depression is about 42% more likely than with second-generation antipsychotics; mood should be monitored closely once mania resolves."
  - "Potent prolactin elevation can cause galactorrhoea, amenorrhoea, sexual dysfunction, and long-term bone density loss."

