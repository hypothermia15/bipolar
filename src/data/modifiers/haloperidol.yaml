icon: "🧠"
color: "#6c7ae0"
label: "Haloperidol"
desc: "The steepest wall in front of mania — and the deepest slide into depression afterwards."
detail: "High-potency first-generation antipsychotic. Its D2 blockade (Ki 1.6 nM) is the strongest in this set, which is why it flattens the manic well further than any atypical and raises the tallest barrier in front of it. Weak H1 affinity means comparatively little sedation, but weak 5-HT2A affinity removes the serotonergic buffer that protects atypicals from extrapyramidal effects — modelled here as jitter (akathisia). It does nothing for depression and carries a higher rate of switching into it."
