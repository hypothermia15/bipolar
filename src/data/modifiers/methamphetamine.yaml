warnings:
  - "At the higher doses typical of illicit use (50 mg or more) methamphetamine can produce psychosis; psychotic symptoms affect up to about 40% of users and can include agitation, violence and delusions."
  - "In a subset of users psychosis recurs and persists, and may be difficult to distinguish from a primary psychotic disorder."
  - "Its hypertensive effect can produce acute and chronic cardiovascular complications."
  - "Repeated use may induce neurotoxicity, associated with prolonged psychiatric symptoms, cognitive impairment and an increased risk of Parkinson's disease."
  - "Abrupt cessation after repeated use leads to withdrawal with depressed mood, anxiety and sleep disturbance; the acute phase typically lasts 7 to 10 days."

