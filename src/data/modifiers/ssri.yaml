warnings:
- In bipolar disorder, antidepressant monotherapy was associated with an increased risk of mania (hazard ratio 2.83); no acute increase was seen with a concurrent mood stabilizer.
- 'ISBD task force: in bipolar I disorder antidepressants should be prescribed only as an adjunct to mood-stabilizing medication.'
- 'ISBD task force: a major concern is mood switch to hypomania, mania and mixed states; serotonin reuptake inhibitors and bupropion may have lower switch rates than tricyclics, tetracyclics and SNRIs.'
- 'ISBD task force: the evidence base for the efficacy and safety of antidepressants in bipolar disorder is weak.'
