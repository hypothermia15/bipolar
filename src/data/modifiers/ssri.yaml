label: Antidepressant (SSRI)
desc: Shallows the depressive basin but deepens the manic basin when used alone. Try it with and without a mood stabilizer.
detail: Represents serotonin reuptake inhibitors as a class. In a Swedish registry study the increased risk of treatment-emergent mania was confined to antidepressant monotherapy. Added in the Turkish adaptation; landscape parameters are illustrative.
