warnings:
- Extended-release carbamazepine was more effective than placebo for acute manic or mixed episodes in a 3-week randomized trial (N = 239), with improvement from day 7.
- Adverse events more frequent than with placebo were dizziness (39.3%), somnolence (30.3%) and nausea (23.8%); total cholesterol increased.
- HLA-B*1502 is strongly associated with carbamazepine-induced Stevens-Johnson syndrome in Han Chinese.
