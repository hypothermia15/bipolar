warnings:
  - "Concurrent use with opioids significantly increases risk of profound sedation, respiratory depression, coma, and death; this combination should be avoided or used only when no alternatives exist."
  - "Physical dependence develops within weeks of regular use; abrupt discontinuation can cause life-threatening withdrawal seizures and delirium — tapering must be gradual."
  - "Schedule IV controlled substance with significant misuse and addiction potential, particularly in people with a history of substance use disorders."
  - "Causes CNS depression including sedation, psychomotor impairment, and anterograde amnesia; patients should avoid driving, alcohol, and other CNS depressants."
  - "In elderly patients it increases the risk of falls, confusion, and paradoxical agitation; lower doses and shorter courses are required."

