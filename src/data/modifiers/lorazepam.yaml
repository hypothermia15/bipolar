category: benzodiazepines
order: 2
icon: "💊"
color: "#48c9b0"
label: "Lorazepam"
desc: "Heavy oil across the landscape, plus a real — if shallow — dent in the manic well. The benzodiazepine that genuinely treats mania."
detail: "Benzodiazepine, positive allosteric modulator at the GABA-A receptor. Head-to-head against clonazepam in acute mania it produced 61% response and 38.5% remission where clonazepam produced none, so it shallows the manic well rather than merely slowing the ball. Cleared by glucuronidation with no active metabolites, which makes it the benzodiazepine of choice in liver disease. No structural repair: tolerance and dependence develop within weeks."
