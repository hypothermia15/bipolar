warnings:
- Among 3,140 people with bipolar disorder, sleep loss triggering episodes of high mood was associated with bipolar I subtype (odds ratio 2.81) and female gender (odds ratio 1.43).
- This should be considered where patients encounter sleep disruption, such as shift work and international travel.
- 'Acute sleep deprivation has an antidepressant effect: the overall response rate was 45% in studies with a randomized control group and 50% in those without.'
