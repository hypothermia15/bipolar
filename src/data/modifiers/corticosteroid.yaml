warnings:
- 'Psychiatric adverse effects of systemic corticosteroids are common: severe reactions in nearly 6% and mild to moderate reactions in about 28% of patients.'
- Short-term therapy most commonly causes euphoria and hypomania; long-term therapy tends to induce depressive symptoms. Delirium and psychosis are possible.
- Dosage is directly related to the incidence of adverse effects, but not to their timing, severity or duration.
- Symptoms often appear early and typically resolve with dose reduction or discontinuation; severe cases may require antipsychotics or mood stabilizers.
