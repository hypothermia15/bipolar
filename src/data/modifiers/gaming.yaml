label: Problematic gaming
desc: Deepens the depressive basin and adds restlessness; the manic basin deepens slightly through lost sleep.
detail: Not a drug. Refers to problematic gaming or gaming disorder, not to ordinary play. It is associated with depression and with poorer sleep in observational studies. Added in the Turkish adaptation; landscape parameters are illustrative.
