warnings:
- In a meta-analysis of people with internet gaming disorder, about one in three had comorbid depression (pooled rate 0.32).
- Problematic gamers reported shorter sleep, poorer sleep quality (odds ratio 2.02) and more sleep problems (odds ratio 2.60); the effect on sleep duration was larger in adolescent samples.
- ICD-11 excludes a diagnosis of gaming disorder when disordered gaming occurs only during an episode of elevated mood in bipolar disorder.
- These are observational associations; they do not show that gaming causes mood episodes.
