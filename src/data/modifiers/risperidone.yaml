category: antipsychotics
order: 4
icon: "🧠"
color: "#85c1e9"
label: "Risperidone"
desc: "Significant shallowing of mania + barrier. Rapid effect, but risk of stiffness."
detail: "Potent D2 antagonist. Rapidly reduces manic agitation. Risk of extrapyramidal symptoms."
halfLife: 18
onset: 2.5
wallStr: 1.5
wells:
  - cx: -0.68
    depth: 0.75
    w: 0.20
  - cx: 0.00
    depth: 0.0
    w: 0.25
  - cx: 0.68
    depth: 2.2
    w: 0.20
damping: 0.975
gravity: 11
barrierH: 1.8
jitter: 0
warnings:
  - "Elderly patients with dementia-related psychosis have increased mortality risk and notably higher rates of stroke; risperidone is not approved for this use."
  - "Carries the highest hyperprolactinemia risk among second-generation antipsychotics — can cause galactorrhea, menstrual irregularities, gynecomastia, and long-term bone density loss."
  - "Extrapyramidal side effects (akathisia, parkinsonism, dystonia) occur more frequently than with many other second-generation antipsychotics, especially above 6 mg/day."
  - "QTc prolongation has been reported; use cautiously with other QT-prolonging agents or in patients with cardiac risk factors."
  - "Causes weight gain and metabolic effects (hyperglycemia, dyslipidemia); metabolic monitoring is recommended."

refs:
  - cite: "Rapid antimanic effect of risperidone monotherapy: a 3-week multicenter, double-blind, placebo-controlled trial."
    url: "https://pubmed.ncbi.nlm.nih.gov/15169694/"
  - cite: "Mood stabilisers plus risperidone or placebo in the treatment of acute mania. International, double-blind, randomised controlled trial."
