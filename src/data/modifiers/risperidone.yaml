warnings:
  - "[Black box] Elderly patients with dementia-related psychosis have increased mortality risk and notably higher rates of stroke; risperidone is not approved for this use."
  - "Carries the highest hyperprolactinemia risk among second-generation antipsychotics — can cause galactorrhea, menstrual irregularities, gynecomastia, and long-term bone density loss."
  - "Extrapyramidal side effects (akathisia, parkinsonism, dystonia) occur more frequently than with many other second-generation antipsychotics, especially above 6 mg/day."
  - "QTc prolongation has been reported; use cautiously with other QT-prolonging agents or in patients with cardiac risk factors."
  - "Causes weight gain and metabolic effects (hyperglycemia, dyslipidemia); metabolic monitoring is recommended."

