warnings:
- In a meta-analysis of 58 studies (96,676 participants), short-form video use was positively correlated with depression (r = 0.24), anxiety (r = 0.26), stress (r = 0.41) and loneliness (r = 0.33).
- Problematic use was associated with lower subjective well-being (r = -0.25); routine use showed no significant association with negative affect or anxiety.
- A systematic review of 20 studies in adolescents raised concerns about lower life satisfaction, problematic usage patterns and spread of psychiatric symptom behaviors, alongside opportunities for self-expression and peer connection.
- Longitudinal and experimental studies are needed to establish causality.
