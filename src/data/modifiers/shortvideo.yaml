detail: Not a drug. Refers to problematic, compulsive use of short-form video (TikTok, Reels, Shorts), not to routine use. Problematic use is associated with depression, anxiety and stress in mostly cross-sectional studies. Added in the Turkish adaptation; landscape parameters are illustrative.
