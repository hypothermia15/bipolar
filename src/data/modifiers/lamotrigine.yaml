warnings:
  - "[Black box] Can cause serious, potentially life-threatening skin reactions including Stevens-Johnson Syndrome (SJS) and toxic epidermal necrolysis (TEN); risk is highest with rapid dose titration and concurrent valproate use."
  - "Dose must be titrated very slowly; valproate roughly doubles lamotrigine levels (requiring halved doses), while enzyme inducers like carbamazepine roughly halve them."
  - "Hormonal contraceptives can reduce lamotrigine plasma levels by up to 50%, potentially reducing efficacy; dose adjustments are often needed."
  - "Carries an FDA class-wide antiepileptic warning for increased suicidal ideation and behavior."

