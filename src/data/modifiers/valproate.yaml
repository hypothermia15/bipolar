warnings:
  - "[Black box] Highly teratogenic: causes neural tube defects in 1–2% of exposures and is associated with lower IQ and autism spectrum disorder in children exposed in utero — avoid in people of childbearing potential unless alternatives have failed."
  - "[Black box] Potentially fatal hepatotoxicity has been reported, especially in children under 2 and polypharmacy patients; monitor liver function, particularly in the first 6 months."
  - "[Black box] Life-threatening pancreatitis has been reported; patients should seek immediate care for new abdominal pain, nausea, or vomiting."
  - "Causes dose-dependent thrombocytopenia and platelet dysfunction, increasing bleeding risk; periodic CBC monitoring is recommended."
  - "Inhibits CYP450 and glucuronidation enzymes — doubles lamotrigine levels and has clinically significant interactions with other antiepileptics."
  - "Associated with polycystic ovary syndrome (PCOS) and hyperandrogenism, particularly when started in adolescence."

