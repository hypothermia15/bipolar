warnings:
- In adults with bipolar disorder, methylphenidate monotherapy was associated with an increased rate of manic episodes within 3 months of initiation (hazard ratio 6.7).
- In patients taking mood stabilizers, the risk of mania was lower after starting methylphenidate (hazard ratio 0.6).
- Careful assessment to rule out bipolar disorder is indicated before starting stimulant monotherapy.
- Up to 20% of people with bipolar disorder have comorbid ADHD.
