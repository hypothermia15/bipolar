label: Methylphenidate
desc: Deepens the manic basin and adds restlessness when used alone. Try it with and without a mood stabilizer.
detail: Stimulant used for ADHD. In a Swedish registry study of adults with bipolar disorder, the increased rate of mania was seen with methylphenidate monotherapy, not with a concurrent mood stabilizer. Added in the Turkish adaptation; landscape parameters are illustrative.
