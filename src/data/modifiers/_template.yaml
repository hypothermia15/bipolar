# ──────────────────────────────────────────────────────────────
# Modifier template — copy this file and rename to <substance>.yaml
# ──────────────────────────────────────────────────────────────

# ── Metadata ──────────────────────────────────────────────────
# category   – UI grouping: stabilizers | antipsychotics | substances
# order      – sort position within the category (1 = first)
# icon       – emoji shown on the button
# color      – hex colour for the button and chart accent

category: stabilizers
order: 1
icon: "💊"
color: "#27ae60"

# ── Display content (English — primary language) ───────────────
# These fields are the single source of truth for UI text.
# Translations for other languages live in src/locales/{pl,de}.json
# under modifiers.<key>.label / desc / detail / sections / warnings.
# Missing translations automatically fall back to the English text here.
#
# label    – short display name shown in the sidebar and info panel
# desc     – one-sentence description of what this modifier does
#            to the landscape (shown prominently in the info panel)
# detail   – longer mechanistic explanation (one paragraph)
# sections – optional list of collapsible sections with bullet points
#            (used for detailed mechanism breakdowns; see lithium.yaml)

label: "Substance Name"
desc: "One-sentence description of the landscape effect."
detail: "Longer mechanistic explanation of how this substance works."

# sections:           # optional — remove if not needed
#   - heading: "Section heading"
#     items:
#       - "First bullet point"
#       - "Second bullet point"

# ── Pharmacokinetics ─────────────────────────────────────────
# halfLife   – elimination half-life in hours
# onset      – time to meaningful clinical effect in hours

halfLife: 12
onset: 2

# ── Landscape boundary ───────────────────────────────────────
# wallStr    – steepness of the outer walls that keep the ball
#              inside the landscape (usually leave at 1.5)

wallStr: 1.5

# ── Wells ─────────────────────────────────────────────────────
# Three wells define the energy landscape, left to right:
#   [0] mania   –  cx ≈ -0.68
#   [1] euthymia – cx ≈  0.00
#   [2] depression – cx ≈  0.68
#
# Each well has:
#   cx    – horizontal center position (keep at the defaults above)
#   depth – how deep (attractive) the state is
#           0   = flat / no pull
#           2.2 = baseline depth for mania & depression
#           higher = harder to escape that state
#   w     – width of the well (wider = broader basin of attraction)

wells:
  - cx: -0.68
    depth: 2.2       # mania depth   (baseline: 2.2)
    w: 0.20
  - cx: 0.00
    depth: 0.0        # euthymia depth (baseline: 0 = unstable hilltop)
    w: 0.25
  - cx: 0.68
    depth: 2.2        # depression depth (baseline: 2.2)
    w: 0.20

# ── Dynamics ──────────────────────────────────────────────────
# damping    – friction coefficient (0–1)
#              lower = more damped, ball loses energy faster (sedation)
#              baseline: 0.985
# gravity    – overall force multiplier — how reactive the system is
#              baseline: 14; lower = sluggish / sedated
# barrierH   – height of a barrier in front of the manic well
#              models dopamine D2 blockade (antipsychotics)
#              0 = no barrier
# jitter     – random noise added each frame
#              models restlessness / agitation
#              0 = calm; >0 used for stimulants, substances

damping: 0.985
gravity: 14
barrierH: 0
jitter: 0

# ── Warnings ──────────────────────────────────────────────────
# List of clinically important warnings and precautions.
# Keep each item to one sentence. Order: most serious risks first,
# then monitoring requirements and drug interactions.

warnings:
  - "Most serious risk or safety warning in one sentence."
  - "Second risk or precaution."
  - "Monitoring requirement or important drug interaction."

# ── References ────────────────────────────────────────────────
# List of supporting clinical / scientific literature.
# Each entry needs a cite (human-readable) and url.

refs:
  - cite: "Author et al. Title of paper. Journal, Year."
    url: "https://pubmed.ncbi.nlm.nih.gov/..."
  - cite: "Another Author et al. Second supporting paper. Journal, Year."
    url: "https://pubmed.ncbi.nlm.nih.gov/..."
